<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="">
        <title></title>
    </head>
    <body>
        <form action="" method="POST">
            <fieldset>
                <legend>Tell me about your self</legend>

                <label for="complete_name">Complete Name:</label>
                <input type="text" id="complete_name" name="complete_name" required>
                
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="profile_link">Enter your website:</label>
                <input type="url" id="profile_link" name="profile_link">
                
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">

                <label for="teaching_hours">Enter hours in teaching in a week:</label>
                <input type="number" id="teaching_hours" name="teaching_hours" min="1" max="40">
                
                

                
            </fieldset>
            <fieldset>
                <legend>Select what grade level are you teaching:</legend>
    
                <div>
                <input type="radio" id="jhs" name="jhs" value="jhs" checked>
                <label for="jhs">Junior High School level</label>
                </div>
                
                <div>
                <input type="radio" id="shs" name="shs" value="shs">
                <label for="shs">Senior High School level</label>
                </div>
                
                <div>
                <input type="radio" id="both_level" name="both_level" value="both_level">
                <label for="both_level">Both Level</label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Choose subjects taught:</legend>
                
                <div>
                <input type="checkbox" id="math" name="math" value="yes">
                <label for="math">Math</label>
                </div>
                
                <div>
                <input type="checkbox" id="english" name="english" value="yes">
                <label for="english">English</label>
                </div>
                
                <div>
                <input type="checkbox" id="science" name="science" value="yes">
                <label for="science">Science</label>
                </div>
                
                <div>
                <input type="checkbox" id="others" name="others" value="yes" checked disabled>
                <label for="others">MAPEH</label>
                </div>
            </fieldset>
        </form>
    </body>
</html>
