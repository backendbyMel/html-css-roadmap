<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A teacher profile survey form for the News Info Inquirer staff database.">
        <title>Teacher Profile Survey | News Info Inquirer</title>
    </head>
    <body>
        <header>
            <h1>Teacher Profile Survey</h1>
            <p>Please complete all required fields to update your staff profile.</p>
        </header>
        <main>
            <form action="/submit-survey.php" method="POST">
                <fieldset>
                    <legend>Personal Information</legend>

                     <p>
                        <label for="complete_name">Complete Name:</label>
                        <input type="text" id="complete_name" name="complete_name" placeholder="Mel Liza Limbago" required>
                    </p>

                    <p>
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </p>
                    
                    <p>
                        <label for="profile_link">Enter your website:</label>
                        <input type="url" id="profile_link" name="profile_link" placeholder="https://yoursite.com">
                    </p>
                    
                    <p>
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" placeholder="555-0199">
                    </p>
                    
                    <p>
                        <label for="teaching_hours">Teaching Hours Per Week (1-40):</label>
                        <input type="number" id="teaching_hours" name="teaching_hours" min="1" max="40" value="20">
                    </p>
                    
                </fieldset>
                <fieldset>
                    <legend>Grade Level Assignment</legend>
        
                    <div>
                        <input type="radio" id="jhs" name="level" value="jhs" checked>
                        <label for="jhs">Junior High School level</label>
                    </div>
                    
                    <div>
                        <input type="radio" id="shs" name="level" value="shs">
                        <label for="shs">Senior High School level</label>
                    </div>
                    
                    <div>
                        <input type="radio" id="both_level" name="level" value="both_level">
                        <label for="both_level">Both Levels</label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Subjects Taught</legend>
                    
                    <div>
                        <input type="checkbox" id="math" name="subjects[]" value="math">
                        <label for="math">Math</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" id="english" name="subjects[]" value="english">
                        <label for="english">English</label>
                    </div>
                    
                    <div>
                    <input type="checkbox" id="science" name="subjects[]" value="science">
                    <label for="science">Science</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" id="others" name="subjects[]" value="mapeh" checked disabled>
                        <label for="others">MAPEH</label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Education Division</legend>
                    
                    <label for="basic_ed">Basic Ed Level</label>
                    <select name="basic_ed" id="basic_ed">
                        <option value="kindergarten">Kindergarten</option>
                        <option value="elementary">Elementary</option>
                        <option value="secondary">Secondary</option>
                    </select>
                </fieldset>

                <div style="margin-top: 20px;">
                    <input type="submit" value="Submit Profile Information">
                </div>
            </form>
        </main>
        
    </body>
</html>
